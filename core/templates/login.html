{% extends "base.html" %}
{% load dm %}
{% block title %}Вход — DateMatch{% endblock %}
{% block content %}
<section class="narrow">
  <div class="panel">
    <div class="page-head"><h1>С возвращением</h1><p>Войдите, чтобы продолжить листать анкеты.</p></div>
    <form id="login-form" class="form" novalidate>
      <div class="field"><label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required><p class="err" data-err="email"></p></div>
      <div class="field"><label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required><p class="err" data-err="password"></p></div>
      <p class="err form-err" id="form-error" role="alert"></p>
      <button class="btn wide" type="submit" id="submit-btn">Войти</button>
      <p class="muted center">Впервые у нас? <a href="/register/">Создайте анкету</a></p>
    </form>
  </div>
</section>
{% endblock %}
{% block scripts %}{% load static %}<script src="{% static 'js/login.js' %}"></script>{% endblock %}
